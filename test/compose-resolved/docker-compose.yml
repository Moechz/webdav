# ===========================================================================
# WebDAV Server for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : rclone/rclone:1.76.0 (Docker Hub, used unmodified)
#                  -> https://github.com/rclone/rclone
#                  -> https://rclone.org/webdav/
#                  Digest is the multi-architecture OCI index, so the same
#                  package works on x86_64 and aarch64.
#
# Ports   : host 8112 -> container 8080.  The host port is unchanged from the
#           previous release and is not one of the reserved ports
#           (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/webdavdocker/.  The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag and digest (never
#           ':latest'), container_name == application id, restart:
#           unless-stopped, non-root user, no privileged mode, no
#           network_mode: host, no cap_add, explicit TZ, a healthcheck on the
#           only service, and x-app-meta as the last block.
# Wrapper : the image entrypoint is replaced so rclone runs as uid 1000 after
#           creating the per-install password file.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  webdavdocker:
    image: rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
    container_name: webdavdocker
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        #!/bin/sh
        # Entrypoint for the WebDAV Server TOS package.
        #
        # The upstream image is rclone/rclone:1.76.0.  It runs `rclone serve webdav`
        # against the mounted data folder as uid 1000.  The image itself is unmodified;
        # this wrapper only creates the per-install password and starts the server.
        set -u
        set -e

        umask 077

        # /media is the WebDAV root.  It is a bind mount owned by the app user (the
        # TOS installer creates and chowns it).  Nothing outside /media is written.
        mkdir -p /media

        # Keep the existing password on upgrade.  The file is deliberately excluded
        # from the WebDAV view below, so clients cannot download it.
        if [ ! -s /media/.webdav-password ]; then
          head -c 18 /dev/urandom | base64 | tr -d '\n' > /media/.webdav-password
        fi
        chmod 600 /media/.webdav-password
        PASS=$$(cat /media/.webdav-password)

        # Credentials go through the environment, not argv, so `ps` does not show the
        # password.  rclone maps RCLONE_<FLAG> to the corresponding command-line flag.
        export RCLONE_USER=tos
        export RCLONE_PASS="$$PASS"

        # HTTP only: this package does not ship or generate TLS certificates.  If HTTPS
        # is required, terminate it in a reverse proxy in front of port 8112.
        #
        # --exclude keeps the credential file out of PROPFIND/GET responses.
        # --dir-cache-time 10s makes files written directly on the NAS show up quickly.
        exec rclone serve webdav /media \
          --addr :8080 \
          --log-level INFO \
          --dir-cache-time 10s \
          --umask 022 \
          --exclude /.webdav-password
    ports:
      - "8112:8080"
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Volume1/DockerAppData/webdavdocker/media:/media
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8080/ 2>&1 | grep -q '401 Unauthorized'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8112
    protocol: http
